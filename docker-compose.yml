services:
  db:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    container_name: br-wissen-db
    restart: unless-stopped
    user: postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/run/postgresql:rw,nosuid,nodev,size=32m
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    env_file:
      - /srv/br-wissensdatenbank/secrets/postgres.env
    volumes:
      - br_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - br_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U br_app -d br_wissen"]
      interval: 20s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
    container_name: br-wissen-app
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /var/tmp:rw,nosuid,nodev,size=256m
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    env_file:
      - /srv/br-wissensdatenbank/secrets/app.env
    volumes:
      - /srv/br-wissensdatenbank:/srv/br-wissensdatenbank
      - /srv/br-wissensdatenbank/secrets:/run/br-secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - br_internal
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./worker
    container_name: br-wissen-worker
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
      - /var/tmp:rw,nosuid,nodev,size=512m
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    env_file:
      - /srv/br-wissensdatenbank/secrets/app.env
    volumes:
      - /srv/br-wissensdatenbank:/srv/br-wissensdatenbank
      - /srv/br-wissensdatenbank/secrets:/run/br-secrets:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - br_internal
    command: ["python", "/app/worker_idle.py"]

  proxy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    container_name: br-wissen-proxy
    restart: unless-stopped
    user: "1001:127"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,noexec,nosuid,nodev,size=32m
      - /data:rw,nosuid,nodev,size=64m
      - /config:rw,nosuid,nodev,size=64m
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    env_file:
      - /srv/br-wissensdatenbank/secrets/caddy-basic-auth.env
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - br_internal
    ports:
      # Nur Loopback fuer lokale Tests; oeffentlicher Zugriff erfolgt spaeter ausschliesslich via Cloudflare Tunnel.
      - "127.0.0.1:18083:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:12ff5c6992a9863db4da270746af7c244bcaee49353039af8104268a18d6c4f0
    container_name: br-wissen-cloudflared
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run:rw,noexec,nosuid,nodev,size=32m
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /srv/br-wissensdatenbank/secrets/cloudflared:/run/br-secrets/cloudflared:ro
    depends_on:
      - proxy
    networks:
      - br_internal

networks:
  br_internal:
    name: br-wissen-internal
    internal: false

volumes:
  br_pgdata:
